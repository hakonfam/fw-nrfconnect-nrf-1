# Basic bootloader configuration
CONFIG_MAIN_STACK_SIZE=2048

# Enable console and logging for debugging
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Disable features not needed for simple bootloader
CONFIG_MULTITHREADING=y
CONFIG_GPIO=n
CONFIG_ARM_MPU=n
CONFIG_TICKLESS_KERNEL=n

# Size optimizations
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LTO=y

# Disable some features to reduce size
CONFIG_KERNEL_MEM_POOL=n
CONFIG_COMMON_LIBC_MALLOC=n

# Basic timer support for delays
CONFIG_SYS_CLOCK_EXISTS=y

# nRF54H20 specific - ensure we can access the target memory region
CONFIG_SOC_NRF54H20=y
